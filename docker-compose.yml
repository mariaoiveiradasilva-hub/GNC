services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gmc
      POSTGRES_PASSWORD: gmc
      POSTGRES_DB: gmc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  api:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://gmc:gmc@db:5432/gmc
    depends_on:
      - db
    ports:
      - "8000:8000"
volumes:
  pgdata:
